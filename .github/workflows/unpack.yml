name: unpack-site
on:
  push:
    paths:
      - ".github/workflows/unpack.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack homepage files
        run: |
          unzip -q Lei-Yausing.github.io.zip -d /tmp/site
          cp -r /tmp/site/Lei-Yausing.github.io/. .
          git rm -q Lei-Yausing.github.io.zip .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack homepage files"
          git push
