name: edit-site
on:
  push:
    paths:
      - ".github/workflows/edit2.yml"
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update research interests
        run: |
          cat > /tmp/edit.py <<'PYEOF'
          import pathlib
          p=pathlib.Path("index.html"); s=p.read_text()
          old='My research is two-fold: <strong>geometric deep learning and data mining</strong> on structured data such as SPD and correlation matrices, and <strong>LLMs, NLP and agentic RL</strong>, where I study models that keep improving from experience they generate themselves and agents that act over many steps.'
          new='My research focuses on <strong>LLMs, vision-language models and agentic RL</strong>: models that keep improving from experience they generate themselves, and multimodal agents that act over many steps. I also work on <strong>geometric deep learning</strong> on SPD and correlation matrices.'
          assert old in s
          p.write_text(s.replace(old,new))
          PYEOF
          python3 /tmp/edit.py
          git rm -q .github/workflows/edit2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lead with LLMs, VLMs and agentic RL in research interests"
          git push
